[package]
name = "link-cache"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
eros = "0.9.0-rc.0"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip", "brotli", "deflate"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
walkdir = "2"
